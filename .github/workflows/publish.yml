name: Publish

# Pure-Python publish pipeline, modeled on naja's wheels.yml but without the
# cibuildwheel matrix (naja-scope ships a single py3-none-any wheel):
#   - build sdist + wheel once and twine-check them
#   - on push to main / manual run: upload to TestPyPI (skip-existing)
#   - on a v* tag: upload the release to PyPI
on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      mcp_registry:
        description: Publish server.json to the official MCP Registry
        type: boolean
        default: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check release metadata
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from naja_scope import __version__

          server = json.loads(Path("server.json").read_text())
          assert server["version"] == __version__, "MCP server version differs from package"
          assert all(p["version"] == __version__ for p in server["packages"])
          assert Path(f"docs/releases/{__version__}.md").is_file(), "Release notes missing"
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{__version__}", "Tag differs from package version"
          PY

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  test-pypi:
    name: Upload to TestPyPI
    needs: build
    if: github.repository == 'keplertech/naja-scope' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # enables trusted publishing if a TestPyPI publisher is configured
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          # Trusted publishing (OIDC) — no long-lived token. Requires a
          # TestPyPI trusted publisher configured for this repo/workflow with
          # environment name `pypi` (https://test.pypi.org/manage/account/publishing/).
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Upload release to PyPI
    needs: test-pypi
    if: github.repository == 'keplertech/naja-scope' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          skip-existing: true

  # Publish server.json to the official MCP Registry. GitHub OIDC login is
  # required: the interactive `mcp-publisher login github` flow cannot read
  # organization roles, so it cannot publish under io.github.keplertech.
  mcp-registry:
    name: Publish to MCP Registry
    needs: [build, pypi]
    if: >-
      !cancelled() &&
      github.repository == 'keplertech/naja-scope' &&
      needs.build.result == 'success' &&
      (needs.pypi.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.mcp_registry))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

  # A GitHub Release (not just the tag) is what Glama's Auto-Release
  # listens to, so every published tag also gets a Release.
  github-release:
    name: Create GitHub Release
    needs: pypi
    if: github.repository == 'keplertech/naja-scope' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "naja-scope $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --verify-tag
